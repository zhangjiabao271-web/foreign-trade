# Add after fresh.compose.yml; always use -p trade-fresh-acceptance.
# These loopback-only endpoints are reserved for the retained browser recovery fixture.
services:
  postgres:
    ports: !override ["127.0.0.1:25432:5432"]
  minio:
    ports: !override ["127.0.0.1:29000:9000"]
  commercial-postgres-restored:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: trade_workbench_e2e
      POSTGRES_USER: rehearsal
      POSTGRES_PASSWORD: local-isolated-rehearsal-only
    ports: ["127.0.0.1:25433:5432"]
    volumes:
      - commercial-postgres-restored-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehearsal -d trade_workbench_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20
  commercial-minio-restored:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: rehearsal
      MINIO_ROOT_PASSWORD: local-isolated-rehearsal-only
    ports: ["127.0.0.1:29001:9000"]
    volumes:
      - commercial-minio-restored-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  commercial-postgres-restored-data:
  commercial-minio-restored-data:
