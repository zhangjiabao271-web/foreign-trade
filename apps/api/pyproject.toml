[project]
name = "trade-workbench-api"
version = "0.1.0"
description = "FastAPI application for the trade workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "minio>=7.2,<8",
    "PyJWT[crypto]>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
