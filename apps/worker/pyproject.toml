[project]
name = "trade-workbench-worker"
version = "0.1.0"
description = "Celery worker for the trade workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.6,<6",
    "pydantic-settings>=2.7,<3",
    "trade-workbench-api",
]

[tool.uv.sources]
trade-workbench-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
